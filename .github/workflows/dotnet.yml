name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ApiNavigator.sln

      - name: Build solution
        run: dotnet build ApiNavigator.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ApiNavigator.sln --configuration Release --no-build --verbosity normal
